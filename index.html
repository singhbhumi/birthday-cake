<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <style>
        #mainTitle {
            font-size: 32px;
            font-family: 'Pixelify Sans', sans-serif;
            margin-bottom: 8px;
        }

        #subTitle {
            font-size: 18px;
            font-family: 'Pixelify Sans', sans-serif;
            color: #555;
        }
    </style>
</head>



<body>
    <div class="container">
        <div id="birthdayText"></div>
        <div class="cake-container">
            <div class="cake" id="cake"></div>
        </div>
    </div>

    <canvas id="confetti"></canvas>

    <script>

        // ---------- Confetti JS ----------
        const confettiCanvas = document.getElementById("confetti");
        const confettiCtx = confettiCanvas.getContext("2d");
        let confettiPieces = [];
        let confettiRunning = false;

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfetti();
        window.addEventListener("resize", resizeConfetti);

        function startConfetti() {
            if (confettiRunning) return;
            confettiRunning = true;
            confettiPieces = [];

            const colors = ["#ff5252", "#ffeb3b", "#4caf50", "#2196f3", "#e91e63"];

            for (let i = 0; i < 180; i++) {
                confettiPieces.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * -confettiCanvas.height,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    rotation: Math.random() * 360
                });
            }

            function animate() {
                if (!confettiRunning) return;

                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

                confettiPieces.forEach(p => {
                    confettiCtx.save();
                    confettiCtx.translate(p.x, p.y);
                    confettiCtx.rotate((p.rotation * Math.PI) / 180);
                    confettiCtx.fillStyle = p.color;
                    confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    confettiCtx.restore();

                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += 5;

                    if (p.y > confettiCanvas.height) {
                        p.y = -10;
                        p.x = Math.random() * confettiCanvas.width;
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();

            setTimeout(() => {
                confettiRunning = false;
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }, 4000);
        }

        // Read URL params
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name") || "Baba";
        let candleCount = parseInt(params.get("candles")) || 4;
        candleCount = Math.min(Math.max(candleCount, 1), 30);

        const birthdayText = document.getElementById("birthdayText");
        birthdayText.innerHTML = `
        <div id="mainTitle">Happy Birthday, ${name}!</div>
        <div id="subTitle">Make a wish and blow candles.</div>
      `;

        const cake = document.getElementById("cake");

        const colors = [
            "green-candle",
            "purple-candle",
            "blue-candle",
            "yellow-candle",
        ];
        const CAKE_VISUAL_WIDTH = 35;

        function createCandles(count) {
            cake.innerHTML = "";
            const CANDLE_VISUAL_WIDTH = 2;
            const availableWidth = CAKE_VISUAL_WIDTH;
            const candlesPerRow = 6;
            const rowCount = Math.ceil(count / candlesPerRow);
            const shiftAmount = 4;

            for (let i = 0; i < count; i++) {
                const candle = document.createElement("div");
                candle.classList.add("candle");
                const colorClass = colors[Math.floor(Math.random() * colors.length)];
                candle.classList.add(colorClass);

                const row = Math.floor(i / candlesPerRow);
                const col = i % candlesPerRow;
                const totalCandlesInRow = Math.min(
                    candlesPerRow,
                    count - row * candlesPerRow
                );
                const rowSpacing = availableWidth / (totalCandlesInRow + 1);

                const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
                const rowShift = row % 2 === 0 ? 0 : shiftAmount;

                candle.style.position = "absolute";
                candle.style.top = `${10 + row * 3}px`;
                candle.style.left = `${leftBase - rowShift + 4}px`;

                cake.appendChild(candle);
            }
        }

        createCandles(candleCount);



        // === Microphone / Blow Detection ===
        async function startMicDetection() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                });
                const audioContext = new (window.AudioContext ||
                    window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;

                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                let blown = false;

                function detectBlow() {
                    analyser.getByteFrequencyData(dataArray);

                    let highFreqSum = 0;
                    let lowFreqSum = 0;

                    const midpoint = dataArray.length / 2;

                    for (let i = 0; i < dataArray.length; i++) {
                        if (i < midpoint) {
                            lowFreqSum += dataArray[i];
                        } else {
                            highFreqSum += dataArray[i];
                        }
                    }

                    const highAvg = highFreqSum / (dataArray.length / 2);
                    const lowAvg = lowFreqSum / (dataArray.length / 2);

                    const ratio = highAvg / (lowAvg + 1);

                    const BLOW_RATIO_THRESHOLD = 0.5;

                    if (ratio > BLOW_RATIO_THRESHOLD && !blown) {
                        blown = true;
                        blowOutCandles();
                    }

                    requestAnimationFrame(detectBlow);
                }

                detectBlow();
            } catch (err) {
                console.error("Mic access error:", err);
            }
        }

        function blowOutCandles() {
            const candles = document.querySelectorAll(".candle");
            candles.forEach((candle) => {
                const delay = Math.random() * 1000;
                setTimeout(() => {
                    colors.forEach((color) => {
                        if (candle.classList.contains(color)) {
                            candle.classList.add("blown");
                        }
                    });
                }, delay);
            });

            startConfetti();

            // Update subTitle after short delay
            setTimeout(() => {
                const subTitle = document.getElementById("subTitle");
                subTitle.textContent = `Yayy! Wishing you the happiest birthday ever!! 🎉`;
            }, 1200);
        }

        async function startMicDetection() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      },
    });

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    // IMPORTANT: resume context (Safari/Chrome sometimes start suspended)
    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    const source = audioContext.createMediaStreamSource(stream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;

    source.connect(analyser);

    const timeData = new Uint8Array(analyser.fftSize);

    let blown = false;
    let lastTrigger = 0;

    function detectBlow() {
      analyser.getByteTimeDomainData(timeData);

      // Calculate RMS (volume) + ZCR (noisiness)
      let sumSquares = 0;
      let zeroCrossings = 0;

      let prev = (timeData[0] - 128) / 128;

      for (let i = 1; i < timeData.length; i++) {
        const v = (timeData[i] - 128) / 128;
        sumSquares += v * v;

        if ((v >= 0 && prev < 0) || (v < 0 && prev >= 0)) zeroCrossings++;
        prev = v;
      }

      const rms = Math.sqrt(sumSquares / timeData.length);
      const zcr = zeroCrossings / timeData.length;

      // Tune these if needed:
      const RMS_THRESHOLD = 0.08;  // how loud the blow is
      const ZCR_THRESHOLD = 0.07;  // how "noise-like" it is
      const COOLDOWN_MS = 1500;

      const now = performance.now();

      if (!blown && now - lastTrigger > COOLDOWN_MS && rms > RMS_THRESHOLD && zcr > ZCR_THRESHOLD) {
        blown = true;
        lastTrigger = now;
        blowOutCandles();

        // Optional: stop mic after success
        stream.getTracks().forEach(t => t.stop());
        audioContext.close();
        return;
      }

      requestAnimationFrame(detectBlow);
    }

    detectBlow();
  } catch (err) {
    console.error("Mic access error:", err);
  }
}

    </script>

</body>

</html>
